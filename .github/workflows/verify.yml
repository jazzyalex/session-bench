name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q scripts evidence tests
      - name: Regenerate leaderboard and require byte-identical output
        run: |
          python scripts/evaluate.py \
            --measurements data/measurements.json \
            --checklist data/verdicts.yml \
            --out /tmp/leaderboard.yml
          diff /tmp/leaderboard.yml data/leaderboard.yml
      - run: python -m pytest tests/ -q
